[project]
name = "scheme-sathi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
scheme-sathi-server = "backend.main:main"
scheme-sathi-scraper = "scheme_sathi.scraper:save_all_schemes"
scheme-sathi-build-db = "backend.build_vectordb:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
